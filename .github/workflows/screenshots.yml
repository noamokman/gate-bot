name: Screenshots

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Install an emoji font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Render and compare the README screenshots
        run: yarn screenshots:check

      - name: Upload rendered screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            dist/screenshots/rendered
            dist/screenshots/diff
          if-no-files-found: ignore
